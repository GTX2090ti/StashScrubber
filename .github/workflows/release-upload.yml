# 把指定 run 的 IPA artifact 上传到指定 Release（本机 upload.github.com 被墙时的替代通路）
#
# 使用方式：
#   gh workflow run release-upload.yml -f run_id=<构建run的ID> -f tag=v1.5.9
#   或 API: POST /actions/workflows/release-upload.yml/dispatches
#       {"ref":"main","inputs":{"run_id":"123","tag":"v1.5.9"}}
name: Upload artifact to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Source run ID that produced the IPA artifact"
        required: true
      tag:
        description: "Release tag to upload to, e.g. v1.5.9"
        required: true
      asset_name:
        description: "Asset filename (optional, defaults to StashScrubber-unsigned.ipa)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" \
            -n StashScrubber-unsigned-ipa \
            -R "$GITHUB_REPOSITORY" \
            -D artifact
          ls -la artifact

      - name: Rename asset if requested
        run: |
          if [ -n "${{ inputs.asset_name }}" ]; then
            mv artifact/StashScrubber-unsigned.ipa "artifact/${{ inputs.asset_name }}"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" artifact/*.ipa \
            --clobber \
            -R "$GITHUB_REPOSITORY"
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
