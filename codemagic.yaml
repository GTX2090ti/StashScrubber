workflows:
  ios-ipa:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      manual:
        enabled: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate project & archive
        script: |
          set -e
          xcodegen generate
          xcodebuild archive \
            -project StashScrubber.xcodeproj \
            -scheme StashScrubber \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StashScrubber.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/StashScrubber.xcarchive/Products/Applications/StashScrubber.app build/Payload/
          cd build
          zip -r ../StashScrubber-unsigned.ipa Payload
    artifacts:
      - StashScrubber-unsigned.ipa
