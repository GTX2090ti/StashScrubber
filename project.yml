name: StashScrubber
options:
  bundleIdPrefix: com.hsx.stash
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"   # 1=iPhone, 2=iPad
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.5.42"      # 发版时同步更新（设置页版本号显示需一并修改）
    CURRENT_PROJECT_VERSION: "6"    # CI 构建时由 run number 自动覆盖
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    # Access WiFi Information：NEHotspotNetwork.current 需要，SDK 按 entitlement 门控 API 可见性
    CODE_SIGN_ENTITLEMENTS: StashScrubber/StashScrubber.entitlements

# CI 使用的构建方案（GitHub Actions macOS runner 上 xcodebuild 需要 scheme）
schemes:
  StashScrubber:
    build:
      targets:
        StashScrubber: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  StashScrubber:
    type: application
    platform: iOS
    sources:
      - path: StashScrubber
    info:
      path: StashScrubber/Info.plist
      properties:
        CFBundleDisplayName: Stash 削刮
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # 内网 HTTP 访问 Stash 必须放开 ATS
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS 14+ 访问本地网络（内网 IP / NAS）必须声明，否则系统直接拦截连接
        NSLocalNetworkUsageDescription: App 需要访问本地网络，用于连接您家中的 Stash 服务器（内网地址）。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
